name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Debug — directory test with full output
        run: |
          chmod +x gradlew
          # First check java version
          java -version
          # Run just directory test with full output
          ./gradlew :agent-os-directory:test --stacktrace 2>&1 || true
          # Show test results if they exist
          find . -name "TEST-*.xml" -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null || true
