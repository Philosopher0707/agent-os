name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Debug — capture compile errors
        run: |
          chmod +x gradlew
          java -version
          ./gradlew :agent-os-directory:compileJava --stacktrace 2>&1 | tee /tmp/build.log
          echo "=== EXIT CODE: $? ==="
