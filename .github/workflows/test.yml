name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AGENTOS_MANAGEMENT_PORT: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile all modules
        run: ./gradlew compileJava --no-daemon

      - name: Kernel tests
        run: ./gradlew :agent-os-kernel:test --no-daemon -Dagentos.management.port=29091

      - name: Directory tests
        run: ./gradlew :agent-os-directory:test --no-daemon

      - name: Messaging tests
        run: ./gradlew :agent-os-messaging:test --no-daemon

      - name: BDI tests
        run: ./gradlew :agent-os-reasoning-bdi:test --no-daemon

      - name: Reactive tests
        run: ./gradlew :agent-os-reasoning-reactive:test --no-daemon

      - name: LLM tests
        run: ./gradlew :agent-os-reasoning-llm:test --no-daemon

      - name: gRPC tests
        run: ./gradlew :agent-os-transport-grpc:test --no-daemon -Dagentos.management.port=29091

      - name: Demo unit tests
        run: ./gradlew :agent-os-demo:test --tests "com.agentos.demo.*" --no-daemon -Dagentos.management.port=29091

      - name: Production hardening tests
        run: ./gradlew :agent-os-demo:test --tests "com.agentos.hardening.ProductionHardeningTest" --no-daemon -Dagentos.management.port=29091

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
