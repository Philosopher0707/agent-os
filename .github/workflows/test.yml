name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile & Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test -x :agent-os-persistence-postgres:test

      - name: Production Hardening Tests
        run: ./gradlew :agent-os-demo:test --tests "com.agentos.hardening.ProductionHardeningTest"
