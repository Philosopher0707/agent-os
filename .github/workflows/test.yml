name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile kernel (root dependency)
        run: ./gradlew :agent-os-kernel:compileJava --stacktrace

      - name: Compile remaining modules
        run: ./gradlew compileJava -x :agent-os-kernel:compileJava --stacktrace

      - name: Run unit tests (skip Postgres)
        run: ./gradlew test -x :agent-os-persistence-postgres:test --stacktrace
